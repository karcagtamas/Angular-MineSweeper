<!-- Játék tábla -->
<mat-card id="table-container">
  @if (game()) {
    <div id="table">
      @for (row of map; track row) {
        <div class="row">
          @for (col of row; track col.id) {
            <app-tile
              [mine]="col"
              (leftClick)="leftClick($event)"
              (bomb)="bomb()"
              (rightClick)="rightClick($event)"
            />
          }
        </div>
      }
    </div>
  }
</mat-card>

<mat-card id="info-container">
  <mat-card-header>
    <mat-card-title>Info</mat-card-title>
  </mat-card-header>
  <mat-card-actions>
    <button mat-raised-button (click)="start()">
      @if (game()) {
        <span>Reset</span>
      } @else {
        <span>Start</span>
      }
    </button>
    <button mat-raised-button (click)="changeLevel()">Change Level</button>
  </mat-card-actions>

  <mat-card-footer>
    @if (message()) {
      <div class="box message">
        {{ message() }}
      </div>
    } @else {
      <div class="box details">
        <div class="remaining-mines">
          <strong>Remaining mines</strong>: {{ mines - status.marked | count }}
        </div>
        <div class="elapsed-time">
          <strong>Elapsed time</strong>: {{ seconds() | elapsedTime }}
        </div>
      </div>
    }
  </mat-card-footer>
</mat-card>
